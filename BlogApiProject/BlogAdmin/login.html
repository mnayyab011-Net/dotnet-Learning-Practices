<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBlog Admin | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin-login-page">
        <div class="admin-login-card">
            <div class="admin-logo">
                My<span>Blog</span>
            </div>
            <div class="admin-badge">
                ADMIN PANEL
            </div>
            <h1>Welcome Back</h1>
            <p class="admin-subtitle">
                Login to manage your blog
            </p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">
                        Email
                    </label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter admin email"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="password">
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >
                </div>
                <button
                    type="submit"
                    class="admin-login-btn"
                    id="loginBtn">
                    Login to Dashboard
                </button>
            </form>
            <div
                id="message"
                class="message">
            </div>
            <div class="back-to-blog">
                <a href="../BlogFrontend/index.html">
                    ← Back to MyBlog
                </a>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
