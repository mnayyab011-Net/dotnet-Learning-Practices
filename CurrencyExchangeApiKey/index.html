<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Currency Exchange API</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<div class="header">
<h1>Currency Exchange</h1>
<p>Convert currencies quickly and easily</p>
</div>
<div class="converter">
<div class="input-group">
<label>Amount</label>
<input type="number" id="amount" value="1" min="0">
</div>
<div class="currency-row">
<div class="input-group">
<label>From</label>
<select id="fromCurrency">
<option value="USD">USD - US Dollar</option>
<option value="EUR">EUR - Euro</option>
<option value="GBP">GBP - British Pound</option>
<option value="PKR">PKR - Pakistani Rupee</option>
<option value="AED">AED - UAE Dirham</option>
<option value="SAR">SAR - Saudi Riyal</option>
<option value="INR">INR - Indian Rupee</option>
<option value="CAD">CAD - Canadian Dollar</option>
<option value="AUD">AUD - Australian Dollar</option>
<option value="JPY">JPY - Japanese Yen</option>
</select>
</div>
<button id="swap">⇄</button>
<div class="input-group">
<label>To</label>
<select id="toCurrency">
<option value="PKR">PKR - Pakistani Rupee</option>
<option value="USD">USD - US Dollar</option>
<option value="EUR">EUR - Euro</option>
<option value="GBP">GBP - British Pound</option>
<option value="AED">AED - UAE Dirham</option>
<option value="SAR">SAR - Saudi Riyal</option>
<option value="INR">INR - Indian Rupee</option>
<option value="CAD">CAD - Canadian Dollar</option>
<option value="AUD">AUD - Australian Dollar</option>
<option value="JPY">JPY - Japanese Yen</option>
</select>
</div>
</div>
<button class="convert-btn" id="convertBtn">Convert Currency</button>
<div class="result">
<div class="result-title">Converted Amount</div>
<div class="result-value" id="resultValue">--</div>
<div class="rate" id="rate">Enter amount and convert</div>
</div>
<div class="status" id="status"></div>
</div>
<div class="footer">
<p>Currency Exchange API</p>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
